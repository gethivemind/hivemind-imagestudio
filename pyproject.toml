[project]
name = "hivemind-imagestudio"
version = "0.2.0"
description = "Free, local, permissively licensed image MCP server. Quality is a setting, never a consequence."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.11"
authors = [{ name = "Hivemind" }]
keywords = ["mcp", "image-generation", "stable-diffusion.cpp", "flux", "local"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
]
dependencies = [
  "mcp>=1.2",
  "pydantic>=2.6",
  "psutil>=5.9",
  "httpx>=0.27",
  "truststore>=0.9",
  "pillow>=10",
]

[project.urls]
Homepage = "https://github.com/gethivemind/hivemind-imagestudio"
Source = "https://github.com/gethivemind/hivemind-imagestudio"
Issues = "https://github.com/gethivemind/hivemind-imagestudio/issues"
Changelog = "https://github.com/gethivemind/hivemind-imagestudio/releases"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.6"]
e2e = ["playwright>=1.45", "uvicorn>=0.30"]
bg = ["onnxruntime>=1.17", "numpy>=1.26"]

[project.scripts]
imagestudio = "imagestudio.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/imagestudio"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W", "N", "SIM", "RUF"]
ignore = ["RUF012"]
allowed-confusables = ["×", "²", "·"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
