name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        # setup-uv activates a project .venv; install into it (not --system, which the
        # Ubuntu runner's externally managed interpreter refuses) and run tools with uv run
        run: |
          uv venv --clear --python ${{ matrix.python }}
          uv pip install -e ".[dev]"
      - name: Ruff lint
        run: uv run ruff check src tests
      - name: Ruff format
        run: uv run ruff format --check src tests
      - name: Pytest
        run: uv run pytest -q --ignore=tests/e2e

  e2e:
    name: browser tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          uv venv --clear --python 3.12
          uv pip install -e ".[dev,e2e]"
      - name: Install Chromium
        run: uv run playwright install --with-deps chromium
      - name: Browser tests
        run: uv run pytest -q tests/e2e
